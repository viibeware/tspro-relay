# THROWAWAY end-to-end test stack — NOT for production.
#   TSP app ──HTTP──▶ relay-test (UI + API) ──SMTP──▶ mailpit (sink)
#
# The relay is built from this repo. Its admin UI + API are bound to
# localhost ONLY (not the LAN); the TSP app reaches it over the shared
# `tspro_default` docker network at http://relay-test:8000, and the relay
# reaches mailpit at mailpit:1025. Mailpit's web inbox is also
# localhost-only — the relay's own Transaction Log is the operator view.
#
# Run:   RELAY_SECRET_KEY=$(cat /tmp/relay_secret.txt) \
#        RELAY_ADMIN_PASSWORD=<pick-one> \
#          docker compose -f docker-compose.test.yml up -d --build
# Relay UI (local):  http://127.0.0.1:8026  (login admin / $RELAY_ADMIN_PASSWORD)
# Mailpit (local):   http://127.0.0.1:8027  (verifies delivery)
# Down:  docker compose -f docker-compose.test.yml down
services:
  relay-test:
    build: .
    container_name: relay-test
    environment:
      - RELAY_SECRET_KEY=${RELAY_SECRET_KEY:?set RELAY_SECRET_KEY}
      - RELAY_ADMIN_USER=admin
      # Even the throwaway stack refuses to boot with a baked-in password.
      - RELAY_ADMIN_PASSWORD=${RELAY_ADMIN_PASSWORD:?set RELAY_ADMIN_PASSWORD}
      - RELAY_INSECURE_COOKIES=1     # local HTTP testing only
      - RELAY_LOG_LEVEL=INFO
    volumes:
      - ./data-test:/data
    ports:
      - "127.0.0.1:8026:8000"        # relay UI + API — localhost only
    networks: [appnet]
    depends_on: [mailpit]
    restart: unless-stopped

  mailpit:
    # Pinned by digest (multi-arch index for axllent/mailpit, 2026-07).
    image: axllent/mailpit@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
    container_name: mailpit-test
    ports:
      - "127.0.0.1:8027:8025"        # inbox — localhost only, NOT the LAN
    networks: [appnet]
    restart: unless-stopped

networks:
  appnet:
    name: tspro_default
    external: true
