name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly, so new advisories surface without a push

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit pinned dependencies (OSV)
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: -r requirements.txt
